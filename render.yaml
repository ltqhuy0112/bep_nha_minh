services:
  - type: web
    name: bep-nha-minh-api
    branch: codex/prelaunch-free
    region: ohio
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev
    startCommand: npm --workspace @bep-nha-minh/api run start
    autoDeployTrigger: checksPass
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: 10000
      - key: NODE_VERSION
        value: 22
      - key: NEXT_PUBLIC_ORDERING_ENABLED
        value: 'false'
      - key: CUSTOMER_AUTH_ENABLED
        value: 'false'
      - key: DATABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: PUBLIC_WEB_URL
        sync: false
  - type: web
    name: bep-nha-minh-web
    branch: codex/prelaunch-free
    region: ohio
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build && node scripts/deploy/prepare-standalone.cjs
    startCommand: npm --workspace @bep-nha-minh/web run start
    autoDeployTrigger: checksPass
    envVars:
      - key: HOSTNAME
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: NODE_VERSION
        value: 22
      - key: NEXT_PUBLIC_ORDERING_ENABLED
        value: 'false'
      - key: CUSTOMER_AUTH_ENABLED
        value: 'false'
      - key: DATABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: PUBLIC_WEB_URL
        sync: false
      - key: COMMERCE_API_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
